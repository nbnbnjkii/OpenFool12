name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['arena/65b27c44-openfool12']
    paths: ['core/**', 'android/**', 'apk-build/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p apk-build assembleDebug --console=plain 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path('build.log').read_text()
          text = '\n'.join(line for line in text.splitlines() if line.startswith('e:') or 'error:' in line or line.startswith('* What') or line.startswith('> ')) or text[-14000:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFool-neon-debug
          path: apk-build/build/outputs/apk/debug/*.apk
          if-no-files-found: error
