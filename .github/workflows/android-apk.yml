name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['arena/65b27c44-openfool12']
    paths: ['core/**', 'android/**', 'apk-build/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p apk-build assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFool-neon-debug
          path: apk-build/build/outputs/apk/debug/*.apk
          if-no-files-found: error
