# Bootstrap IP certificate issuance. Replace the existing openfool site, do not
# enable this alongside another site declaring the same server_name.
server {
    listen 80;
    server_name 46.30.41.204;
    client_max_body_size 16k;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }
    # Never accept credentials over unencrypted HTTP, even before TLS is ready.
    location / { return 403; }
}
