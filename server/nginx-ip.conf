# Enable only AFTER obtaining the trusted IP certificate.
server {
    listen 80;
    server_name 46.30.41.204;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://46.30.41.204$request_uri; }
}
server {
    listen 443 ssl;
    server_name 46.30.41.204;
    ssl_certificate /etc/letsencrypt/live/46.30.41.204/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46.30.41.204/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
